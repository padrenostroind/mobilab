<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobiLab Gestionale - Desktop Edition</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #0f1115;
            --card: #181b22;
            --accent: #00e676;
            --accent-blue: #2979ff;
            --text: #ffffff;
            --text-muted: #8b949e;
            --danger: #ff5252;
            --warning: #ffb300;
            --border: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        header h1 { font-size: 1.6rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        
        .desktop-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        @media (max-width: 1200px) {
            .desktop-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .desktop-grid { grid-template-columns: 1fr; }
        }

        .panel { background: var(--card); border-radius: 12px; padding: 18px; border: 1px solid var(--border); display: flex; flex-direction: column; height: fit-content; }
        .panel h2 { font-size: 1.1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: #c9d1d9; }

        .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        input, select { flex: 1; min-width: 110px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0d1117; color: #fff; font-size: 0.9rem; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        
        button { padding: 9px 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: opacity 0.2s; }
        button:hover { opacity: 0.85; }
        .btn-add { background: var(--accent); color: #000; width: 100%; margin-top: 4px; }
        .btn-sm { padding: 5px 8px; font-size: 0.75rem; }
        .btn-del { background: var(--danger); color: #fff; }
        .btn-backup { background: #21262d; color: #c9d1d9; border: 1px solid var(--border); }

        .search-box { width: 100%; margin-bottom: 12px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: #0d1117; color: #fff; font-size: 0.85rem; }

        .item-list { list-style: none; display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; padding-right: 4px; }
        .item-list::-webkit-scrollbar { width: 6px; }
        .item-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .item-card { background: #161b22; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-left: 4px solid var(--accent); border: 1px solid var(--border); border-left-width: 4px; }
        .item-card.auction { border-left-color: var(--warning); }
        .item-card.sold { border-left-color: var(--accent-blue); opacity: 0.75; }

        .item-info h3 { font-size: 0.95rem; margin-bottom: 4px; color: #fff; }
        .item-info p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-top: 4px; background: #30363d; color: #c9d1d9; }
        
        .actions { display: flex; align-items: center; gap: 6px; }
        .timer-badge { font-family: monospace; color: var(--warning); font-weight: bold; font-size: 0.85rem; background: rgba(255, 179, 0, 0.1); padding: 2px 6px; border-radius: 4px; }
        .price-tag { color: var(--accent); font-weight: bold; }
        .profit-tag { color: var(--accent); font-weight: bold; }
        .loss-tag { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>💻 MobiLab Gestionale <span style="font-size:0.8rem; color:var(--text); background:#21262d; border:1px solid var(--border);">PC Dashboard</span></h1>
        <div class="header-actions">
            <button class="btn-backup" onclick="exportData()">💾 Esporta Backup</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📂 Importa</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        </div>
    </header>

    <div class="desktop-grid">
        
        <!-- COLONNA 1: ASTE EBAY CON TIMER -->
        <div class="panel">
            <h2>⏳ Monitor Aste eBay</h2>
            <div class="form-row">
                <input type="text" id="auctionItem" placeholder="Oggetto / Modello (es. iPhone 12 lotto)">
            </div>
            <div class="form-row">
                <input type="number" id="auctionMaxBid" placeholder="Tua Offerta Max €">
                <input type="datetime-local" id="auctionEndTime">
            </div>
            <button class="btn-add" style="background:var(--warning); color:#000;" onclick="addAuction()">+ Aggiungi Asta</button>
            
            <input type="text" id="searchAuction" class="search-box" style="margin-top: 15px;" placeholder="🔍 Cerca asta..." oninput="renderAuct()">
            <ul id="auctionList" class="item-list"></ul>
        </div>

        <!-- COLONNA 2: FLIPPING (ACQUISTI & VENDITE DISPOSITIVI) -->
        <div class="panel">
            <h2>📱 Flipping (Compro & Rendo)</h2>
            <div class="form-row">
                <input type="text" id="flipDevice" placeholder="Dispositivo (es. iPhone 13 128GB)">
            </div>
            <div class="form-row">
                <input type="number" id="flipBuyPrice" placeholder="Costo Acquisto €">
                <input type="number" id="flipPartsCost" placeholder="Costo Ricambi €">
            </div>
            <div class="form-row">
                <input type="number" id="flipSellPrice" placeholder="Prezzo Vendita Previsto €">
                <select id="flipStatus">
                    <option value="Da Sistemare">🔧 Da Sistemare</option>
                    <option value="In Vendita">🏷️ In Vendita</option>
                    <option value="Venduto">✅ Venduto</option>
                </select>
            </div>
            <button class="btn-add" onclick="addFlip()">+ Registra Dispositivo</button>

            <input type="text" id="searchFlip" class="search-box" style="margin-top: 15px;" placeholder="🔍 Cerca dispositivo..." oninput="renderFlip()">
            <ul id="flipList" class="item-list"></ul>
        </div>

        <!-- COLONNA 3: MAGAZZINO RICAMBI & UNITÀ -->
        <div class="panel">
            <h2>📦 Magazzino & Prezzi Ricambi</h2>
            <div class="form-row">
                <input type="text" id="invName" placeholder="Articolo / Ricambio (es. Display OLED iPhone 11)">
            </div>
            <div class="form-row">
                <input type="number" id="invQty" placeholder="Q.tà" value="1" style="max-width: 70px;">
                <input type="number" id="invPrice" placeholder="Costo Unitario €">
            </div>
            <button class="btn-add" style="background:var(--accent-blue); color:#fff;" onclick="addInv()">+ Aggiungi in Magazzino</button>

            <input type="text" id="searchInv" class="search-box" style="margin-top: 15px;" placeholder="🔍 Cerca ricambio in magazzino..." oninput="renderInv()">
            <ul id="invList" class="item-list"></ul>
        </div>

    </div>

    <script>
        let auctions = JSON.parse(localStorage.getItem('mobilab_auctions')) || [];
        let flips = JSON.parse(localStorage.getItem('mobilab_flips')) || [];
        let inventory = JSON.parse(localStorage.getItem('mobilab_inventory')) || [];

        function saveData() {
            localStorage.setItem('mobilab_auctions', JSON.stringify(auctions));
            localStorage.setItem('mobilab_flips', JSON.stringify(flips));
            localStorage.setItem('mobilab_inventory', JSON.stringify(inventory));
            renderAll();
        }

        // --- BACKUP & RIPRISTINO ---
        function exportData() {
            const data = { auctions, flips, inventory };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mobilab_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.auctions) auctions = data.auctions;
                    if (data.flips) flips = data.flips;
                    if (data.inventory) inventory = data.inventory;
                    saveData();
                    alert("Backup importato con successo!");
                } catch (err) {
                    alert("Errore durante l'importazione del file JSON.");
                }
            };
            reader.readAsText(file);
        }

        // --- ASTE EBAY ---
        function addAuction() {
            const item = document.getElementById('auctionItem').value.trim();
            const maxBid = document.getElementById('auctionMaxBid').value;
            const endTime = document.getElementById('auctionEndTime').value;

            if (!item || !endTime) return alert("Inserisci almeno il nome dell'oggetto e la data di scadenza!");

            auctions.unshift({ id: Date.now(), item, maxBid: maxBid || '0', endTime });
            document.getElementById('auctionItem').value = '';
            document.getElementById('auctionMaxBid').value = '';
            document.getElementById('auctionEndTime').value = '';
            saveData();
        }

        function deleteAuction(id) {
            if (confirm("Eliminare questa asta dal monitor?")) {
                auctions = auctions.filter(a => a.id !== id);
                saveData();
            }
        }

        // --- FLIPPING ---
        function addFlip() {
            const device = document.getElementById('flipDevice').value.trim();
            const buyPrice = parseFloat(document.getElementById('flipBuyPrice').value) || 0;
            const partsCost = parseFloat(document.getElementById('flipPartsCost').value) || 0;
            const sellPrice = parseFloat(document.getElementById('flipSellPrice').value) || 0;
            const status = document.getElementById('flipStatus').value;

            if (!device) return alert("Inserisci il nome del dispositivo!");

            flips.unshift({ id: Date.now(), device, buyPrice, partsCost, sellPrice, status });
            document.getElementById('flipDevice').value = '';
            document.getElementById('flipBuyPrice').value = '';
            document.getElementById('flipPartsCost').value = '';
            document.getElementById('flipSellPrice').value = '';
            saveData();
        }

        function deleteFlip(id) {
            if (confirm("Rimuovere questo dispositivo?")) {
                flips = flips.filter(f => f.id !== id);
                saveData();
            }
        }

        // --- MAGAZZINO ---
        function addInv() {
            const name = document.getElementById('invName').value.trim();
            const qty = parseInt(document.getElementById('invQty').value) || 1;
            const price = parseFloat(document.getElementById('invPrice').value) || 0;

            if (!name) return alert("Inserisci il nome del ricambio o articolo!");

            inventory.unshift({ id: Date.now(), name, qty, price });
            document.getElementById('invName').value = '';
            document.getElementById('invQty').value = '1';
            document.getElementById('invPrice').value = '';
            saveData();
        }

        function updateInvQty(id, delta) {
            inventory = inventory.map(i => {
                if (i.id === id) i.qty = Math.max(0, i.qty + delta);
                return i;
            });
            saveData();
        }

        function deleteInv(id) {
            if (confirm("Eliminare articolo dal magazzino?")) {
                inventory = inventory.filter(i => i.id !== id);
                saveData();
            }
        }

        // --- RENDER & TIMER ---
        function getTimeRemaining(endtime) {
            const total = Date.parse(endtime) - Date.now();
            if (total <= 0) return "ASTA SCADUTA";
            const seconds = Math.floor((total / 1000) % 60);
            const minutes = Math.floor((total / 1000 / 60) % 60);
            const hours = Math.floor((total / (1000 * 60 * 60)) % 24);
            const days = Math.floor(total / (1000 * 60 * 60 * 24));
            
            let res = "";
            if (days > 0) res += days + "g ";
            res += String(hours).padStart(2, '0') + "h " + String(minutes).padStart(2, '0') + "m " + String(seconds).padStart(2, '0') + "s";
            return res;
        }

        function renderAuct() {
            const q = document.getElementById('searchAuction').value.toLowerCase();
            const list = document.getElementById('auctionList');
            const filtered = auctions.filter(a => a.item.toLowerCase().includes(q));

            list.innerHTML = filtered.length ? '' : '<p style="color:var(--text-muted); font-size:0.85rem; padding:4px;">Nessuna asta monitorata.</p>';
            filtered.forEach(a => {
                let timeLeft = getTimeRemaining(a.endTime);
                list.innerHTML += `
                    <li class="item-card auction">
                        <div class="item-info">
                            <h3>${a.item}</h3>
                            <p>Max Offerta: <span class="price-tag">€${a.maxBid}</span></p>
                            <span class="timer-badge">⏳ ${timeLeft}</span>
                        </div>
                        <div class="actions">
                            <button class="btn-sm btn-del" onclick="deleteAuction(${a.id})">✕</button>
                        </div>
                    </li>
                `;
            });
        }

        function renderFlip() {
            const q = document.getElementById('searchFlip').value.toLowerCase();
            const list = document.getElementById('flipList');
            const filtered = flips.filter(f => f.device.toLowerCase().includes(q));

            list.innerHTML = filtered.length ? '' : '<p style="color:var(--text-muted); font-size:0.85rem; padding:4px;">Nessun dispositivo registrato.</p>';
            filtered.forEach(f => {
                let totalCost = f.buyPrice + f.partsCost;
                let profit = f.sellPrice > 0 ? f.sellPrice - totalCost : 0;
                let profitClass = profit >= 0 ? 'profit-tag' : 'loss-tag';
                let isSold = f.status === 'Venduto' ? 'sold' : '';

                list.innerHTML += `
                    <li class="item-card ${isSold}">
                        <div class="item-info">
                            <h3>${f.device}</h3>
                            <p>Spesa (Acquisto+Ricambi): €${totalCost} | Vendita: <span class="price-tag">€${f.sellPrice}</span></p>
                            <p>Utile Previsto: <span class="${profitClass}">€${profit}</span></p>
                            <span class="badge">${f.status}</span>
                        </div>
                        <div class="actions">
                            <button class="btn-sm btn-del" onclick="deleteFlip(${f.id})">✕</button>
                        </div>
                    </li>
                `;
            });
        }

        function renderInv() {
            const q = document.getElementById('searchInv').value.toLowerCase();
            const list = document.getElementById('invList');
            const filtered = inventory.filter(i => i.name.toLowerCase().includes(q));

            list.innerHTML = filtered.length ? '' : '<p style="color:var(--text-muted); font-size:0.85rem; padding:4px;">Nessun ricambio in magazzino.</p>';
            filtered.forEach(i => {
                let totalVal = i.qty * i.price;
                list.innerHTML += `
                    <li class="item-card" style="border-left-color: var(--accent-blue);">
                        <div class="item-info">
                            <h3>${i.name}</h3>
                            <p>Costo Unit.: €${i.price} | Valore Tot: <span class="price-tag">€${totalVal}</span></p>
                        </div>
                        <div class="actions">
                            <button class="btn-sm" style="background:#30363d;color:#fff;" onclick="updateInvQty(${i.id}, -1)">-</button>
                            <span style="font-weight:bold; min-width:24px; text-align:center;">${i.qty}</span>
                            <button class="btn-sm" style="background:#30363d;color:#fff;" onclick="updateInvQty(${i.id}, 1)">+</button>
                            <button class="btn-sm btn-del" onclick="deleteInv(${i.id})">✕</button>
                        </div>
                    </li>
                `;
            });
        }

        function renderAll() {
            renderAuct();
            renderFlip();
            renderInv();
        }

        renderAll();
        setInterval(renderAuct, 1000);
    </script>
</body>
</html>
